# Раннер-контейнер. Поднимается автоматически при старте Docker (restart unless-stopped),
# живёт в той же сети, что Vexa, поэтому ходит к ней по имени контейнера vexa-lite.
#
# Запуск/обновление:  docker compose up -d --build
# Логи:               docker logs -f tryll-runner
# Остановить:         docker compose down
services:
  runner:
    build: .
    image: tryll-runner
    container_name: tryll-runner
    restart: unless-stopped
    env_file: .env
    environment:
      # внутри docker-сети Vexa доступна по имени контейнера, а не localhost
      VEXA_BASE_URL: http://vexa-lite:8056
      # персистентный стор обработанных митов (переживает рестарт/пересборку),
      # иначе бот возвращается на мит после кика
      STORE_FILE: /data/store.json
      SKIP_FILE: /cmd/skip.json
      # Дальний backstop раннера (форс-стоп зависших ботов). Держим ЧУТЬ ПОЗЖЕ
      # Vexa-лимита max_bot_time (4ч от захода ≈ старт+235мин), чтобы раннер не
      # срезал бота раньше Vexa. 250 мин от старта мита = запас ~15 мин. (2026-09-03)
      HARD_MAX_MIN: "250"
    volumes:
      - runner-data:/data
      - tryll-cmd:/cmd
    networks:
      - vexa-network

  # Дашборд-календарь (read-only): смотрит миты всех + статус бота. Изолирован —
  # монтирует стор раннера ТОЛЬКО на чтение (:ro), на ботов/раннер не влияет.
  # Открывать: http://localhost:8090
  dashboard:
    build: ./dashboard
    image: tryll-dashboard
    container_name: tryll-dashboard
    restart: unless-stopped
    env_file: .env
    environment:
      VEXA_BASE_URL: http://vexa-lite:8056
      STORE_FILE: /data/store.json
      DASHBOARD_PORT: 8090
      SKIP_FILE: /cmd/skip.json
    volumes:
      - runner-data:/data:ro
      - tryll-cmd:/cmd
    ports:
      # только localhost: дашборд управляет ботами и отдаёт транскрипты/PII без
      # аутентификации — наружу в LAN его выставлять нельзя. Открываешь с этого же ПК.
      - "127.0.0.1:8090:8090"
    networks:
      - vexa-network

  # Watchdog: следит за runtime_api ВНУТРИ vexa-lite (движок, что запускает ботов)
  # и перезапускает vexa-lite, если тот умер (healthcheck контейнера этого не
  # видит). + раз в ~12ч чистит старые записи. Лечит «включил Docker, а бот не
  # заходит» после ребута ПК. Нужен доступ к docker.sock (локальный self-hosted).
  watchdog:
    image: docker:cli
    container_name: tryll-watchdog
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/watchdog.sh:/watchdog.sh:ro
    entrypoint: ["sh", "/watchdog.sh"]

volumes:
  runner-data:
  tryll-cmd:

networks:
  vexa-network:
    external: true
